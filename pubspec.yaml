name: attendanceapplication
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.1

  # Local Storage (for keeping user logged in)
  shared_preferences: ^2.2.3

  # Location
  geolocator: ^10.1.0
  permission_handler: ^12.0.1

  # Device Info
  #  device_info_plus: ^9.1.0

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true